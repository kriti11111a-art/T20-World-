        <!-- Pre-React Loading Animation Styles -->
        <style>
            #initial-loader {
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                bottom: 0;
                background: #000000;
                display: flex;
                align-items: center;
                justify-content: center;
                flex-direction: column;
                gap: 25px;
                z-index: 999999;
            }
            #initial-loader.hidden { display: none; }
            .loader-candles {
                display: flex;
                align-items: flex-end;
                gap: 15px;
                padding: 30px 40px;
                background: rgba(20, 25, 30, 0.95);
                border-radius: 16px;
                border: 1px solid rgba(255, 215, 0, 0.2);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
            }
            .candle { display: flex; flex-direction: column; align-items: center; }
            .candle-wick { width: 2px; border-radius: 1px; }
            .candle-body { width: 20px; border-radius: 4px; }
            .candle-green .candle-wick { background: #0ECB81; }
            .candle-green .candle-body { background: linear-gradient(180deg, #0ECB81 0%, #00a86b 100%); box-shadow: 0 0 20px rgba(14, 203, 129, 0.6); }
            .candle-red .candle-wick { background: #F6465D; }
            .candle-red .candle-body { background: linear-gradient(180deg, #F6465D 0%, #d63447 100%); box-shadow: 0 0 20px rgba(246, 70, 93, 0.6); }
            .candle { animation: candlePulse 0.8s ease-in-out infinite; transform-origin: bottom center; }
            .candle:nth-child(2) { animation-delay: 0.2s; }
            .candle:nth-child(3) { animation-delay: 0.4s; }
            .candle:nth-child(4) { animation-delay: 0.3s; }
            @keyframes candlePulse { 0%, 100% { transform: scaleY(1); } 50% { transform: scaleY(1.2); } }
            .loader-title { font-size: 36px; font-weight: 800; color: #FFD700; margin: 0; letter-spacing: 3px; text-shadow: 0 0 30px rgba(255, 215, 0, 0.6); font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
            .loader-tagline { font-size: 14px; color: rgba(255, 255, 255, 0.7); margin: 0; letter-spacing: 2px; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
            .loader-progress { width: 200px; height: 4px; background: rgba(255, 255, 255, 0.1); border-radius: 2px; overflow: hidden; }
            .loader-progress-bar { height: 100%; background: linear-gradient(90deg, #FFD700 0%, #0ECB81 50%, #FFD700 100%); border-radius: 2px; animation: progressMove 0.8s ease-out forwards; }
            @keyframes progressMove { 0% { width: 0%; } 100% { width: 100%; } }
        </style>
    </head>

        <noscript>You need to enable JavaScript to run this app.</noscript>
        
        <!-- Pre-React Initial Loader -->
        <div id="initial-loader">
            <div class="loader-candles">
                <div class="candle candle-green">
                    <div class="candle-wick" style="height: 15px;"></div>
                    <div class="candle-body" style="height: 40px;"></div>
                    <div class="candle-wick" style="height: 10px;"></div>
                </div>
                <div class="candle candle-red">
                    <div class="candle-wick" style="height: 12px;"></div>
                    <div class="candle-body" style="height: 50px;"></div>
                    <div class="candle-wick" style="height: 8px;"></div>
                </div>
                <div class="candle candle-green">
                    <div class="candle-wick" style="height: 18px;"></div>
                    <div class="candle-body" style="height: 35px;"></div>
                    <div class="candle-wick" style="height: 12px;"></div>
                </div>
                <div class="candle candle-red">
                    <div class="candle-wick" style="height: 10px;"></div>
                    <div class="candle-body" style="height: 30px;"></div>
                    <div class="candle-wick" style="height: 15px;"></div>
                </div>
            </div>
            <h1 class="loader-title">TradeGo</h1>
            <p class="loader-tagline">Smart Trading, Smart Earning</p>
            <div class="loader-progress">
                <div class="loader-progress-bar"></div>
            </div>
        </div>
